<!doctype html><meta charset="utf-8"><title>AFTERIMAGE film production</title>
<style>body{background:#111;color:#eee;font:16px system-ui;margin:24px}canvas{width:80vw;max-width:960px}button{padding:15px;margin:15px 0}#status{padding:12px}</style>
<h1>여운의 문 — original 48-second film</h1><div id="formats"></div><canvas width="1280" height="720"></canvas><br><button id="start">영상 제작 시작</button><div id="status">준비됨</div>
<script type="module">
import {drawFilm,DURATION} from './film.js';
const canvas=document.querySelector('canvas'),status=document.querySelector('#status');drawFilm(canvas,18);
const candidates=['video/mp4;codecs=avc1.42001E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus'];
const supported=candidates.filter(type=>MediaRecorder.isTypeSupported(type));document.querySelector('#formats').textContent='Supported: '+supported.join(' / ');
document.querySelector('#start').onclick=async()=>{
 document.querySelector('#start').disabled=true;
 const mimeType=supported[0],context=new AudioContext(),audio=context.createMediaStreamDestination(),gain=context.createGain();gain.gain.value=.3;gain.connect(audio);
 const chords=[[48,55,60,64,67],[53,60,64,67,69],[55,62,67,69,74],[48,55,60,64,72]];
 const note=(midi,at,peak=.12,duration=4)=>{
  const osc=context.createOscillator(),envelope=context.createGain(),pan=context.createStereoPanner();osc.type='sine';osc.frequency.value=440*2**((midi-69)/12);pan.pan.value=Math.sin(midi)*.3;
  envelope.gain.setValueAtTime(0,at);envelope.gain.linearRampToValueAtTime(peak,at+.15);envelope.gain.exponentialRampToValueAtTime(.0001,at+duration);
  osc.connect(envelope);envelope.connect(pan);pan.connect(gain);osc.start(at);osc.stop(at+duration+.01);
 };
 await context.resume();const origin=context.currentTime+.08;
 chords.forEach((chord,i)=>{chord.forEach((midi,j)=>note(midi,origin+i*12+j*.16,j?.032:.055,7));for(let n=0;n<6;n++)note(chord[1+n%4]+12,origin+i*12+n*1.8+1.2,.06,4);});
 const stream=canvas.captureStream(24);audio.stream.getAudioTracks().forEach(track=>stream.addTrack(track));
 const recorder=new MediaRecorder(stream,{mimeType,videoBitsPerSecond:1800000,audioBitsPerSecond:96000}),chunks=[];
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
 recorder.onstop=async()=>{
  clearInterval(timer);stream.getTracks().forEach(track=>track.stop());await context.close();
  const blob=new Blob(chunks,{type:mimeType}),extension=mimeType.includes('mp4')?'mp4':'webm';
  status.textContent='파일 저장 중';await fetch('/save-film?ext='+extension,{method:'POST',body:blob});
  drawFilm(canvas,18);const poster=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.94));await fetch('/save-poster',{method:'POST',body:poster});
  status.textContent='완료: afterglow.'+extension+' / '+blob.size+' bytes';
 };
 const start=performance.now();recorder.start(1000);
 const timer=setInterval(()=>{const elapsed=(performance.now()-start)/1000;drawFilm(canvas,elapsed);status.textContent='제작 중 '+elapsed.toFixed(1)+' / 48초';if(elapsed>=DURATION)recorder.stop();},1000/24);
};
</script>
