<!doctype html><html lang="ko"><meta charset="utf-8"><title>AFTERIMAGE film production</title>
<style>body{background:#10151a;color:#ede8de;font:14px system-ui;margin:24px}canvas{width:min(85vw,1100px);display:block}button{padding:12px 18px;margin:14px 10px 14px 0;background:#dcc7a6;border:0;color:#222;cursor:pointer}input{width:400px}output,#status{margin-left:12px}h1{font-size:20px}</style>
<h1>여운의 문 — 경계 / 접힌 빛 / 남겨진 여운</h1><div id="formats"></div><canvas width="1280" height="720"></canvas>
<button id="start">영상 제작 시작</button><button id="preview">미리보기 재생</button><label>장면 <input id="seek" type="range" min="0" max="48" step=".1" value="0"></label><output id="scene"></output><div id="status">준비됨</div><div id="audio">음악 측정 대기</div>
<script type="importmap">{"imports":{"three":"/vendor/build/three.module.js","three/addons/":"/vendor/examples/jsm/"}}</script>
<script type="module">
import {createFilm,DURATION} from './film.js';import {createScore} from './score.js';
const canvas=document.querySelector('canvas'),status=document.querySelector('#status'),scene=document.querySelector('#scene'),seek=document.querySelector('#seek'),film=createFilm(canvas);
const candidates=['video/mp4;codecs=avc1.42001E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus'];const supported=candidates.filter(type=>MediaRecorder.isTypeSupported(type));document.querySelector('#formats').textContent='Supported: '+supported.join(' / ');
let previewFrame;const draw=t=>{scene.textContent=film.draw(t);seek.value=t;};seek.oninput=()=>{cancelAnimationFrame(previewFrame);draw(Number(seek.value));};document.querySelector('#preview').onclick=()=>{cancelAnimationFrame(previewFrame);const start=performance.now();const tick=()=>{draw((performance.now()-start)/1000%48);previewFrame=requestAnimationFrame(tick);};tick();};
document.querySelector('#start').onclick=async()=>{
 cancelAnimationFrame(previewFrame);document.querySelector('#start').disabled=true;document.querySelector('#preview').disabled=true;seek.disabled=true;
 const mimeType=supported[0],context=new AudioContext(),audio=context.createMediaStreamDestination(),score=createScore(context,audio);await context.resume();score.schedule(context.currentTime+.08);score.fade(context.currentTime+46);
 const stream=canvas.captureStream(24);audio.stream.getAudioTracks().forEach(track=>stream.addTrack(track));
 const recorder=new MediaRecorder(stream,{mimeType,videoBitsPerSecond:3200000,audioBitsPerSecond:160000}),chunks=[],levels=new Float32Array(score.analyser.fftSize);let peak=0,rmsSum=0,samples=0,frame;
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
 recorder.onstop=async()=>{cancelAnimationFrame(frame);stream.getTracks().forEach(track=>track.stop());await context.close();const blob=new Blob(chunks,{type:mimeType}),extension=mimeType.includes('mp4')?'mp4':'webm';status.textContent='파일 저장 중';const response=await fetch('/save-film?ext='+extension,{method:'POST',body:blob});if(!response.ok)throw new Error(await response.text());draw(24);const poster=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.94));await fetch('/save-poster',{method:'POST',body:poster});status.textContent='완료: afterglow.'+extension+' / '+blob.size+' bytes';document.querySelector('#audio').textContent=`출력 음악: peak ${peak.toFixed(3)} / 평균 RMS ${(rmsSum/samples).toFixed(3)}`;seek.disabled=false;document.querySelector('#preview').disabled=false;};
 const start=performance.now();draw(0);recorder.start(1000);const tick=()=>{const elapsed=(performance.now()-start)/1000;draw(Math.min(48,elapsed));score.analyser.getFloatTimeDomainData(levels);let energy=0;for(const value of levels){peak=Math.max(peak,Math.abs(value));energy+=value*value;}rmsSum+=Math.sqrt(energy/levels.length);samples++;status.textContent='제작 중 '+elapsed.toFixed(1)+' / 48초';document.querySelector('#audio').textContent=`출력 음악 peak ${peak.toFixed(3)}`;if(elapsed>=DURATION)recorder.stop();else frame=requestAnimationFrame(tick);};tick();
};
</script></html>
